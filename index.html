<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GP73 Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background:#0b0b0b; color:#f4f4f4; }
    textarea, button, a { font: inherit; }
    textarea { width: 100%; min-height: 100px; margin: 12px 0; padding: 12px; border-radius: 10px; border:1px solid #333; background:#111; color:#fff; }
    button, a.btn { display:inline-block; padding: 12px 16px; border-radius:10px; border:0; background:#d7b46a; color:#111; text-decoration:none; font-weight:700; }
    pre { white-space: pre-wrap; background:#111; padding:16px; border-radius:10px; border:1px solid #333; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .muted { color:#aaa; }
  </style>
</head>
<body>
  <h1>GP73</h1>
  <p class="muted">Ask a question. Answers come from Supabase first, then bible-api.com fallback.</p>
  <textarea id="q" placeholder="Ask GP73..."></textarea>
  <div class="row">
    <button id="ask">Ask</button>
    <a class="btn" href="https://stan.store/iamgodsprisoner" target="_blank" rel="noreferrer">Go deeper →</a>
  </div>
  <h3>Response</h3>
  <pre id="out">Ready.</pre>
  <script>
    const q = document.getElementById('q');
    const out = document.getElementById('out');
    document.getElementById('ask').onclick = async () => {
      out.textContent = 'Thinking...';
      const r = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q.value })
      });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    };
  </script>
</body>
</html>
