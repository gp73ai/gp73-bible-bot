<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Store</title>
<link rel="manifest" href="/manifest.json" />
<style>
  :root{
    --brand-bg:#080808;
    --brand-surface:#111111;
    --brand-border:#1a1a1a;
    --brand-text:#efefef;
    --brand-text-muted:#aaaaaa;
    --brand-accent:#FFD600;
    --brand-accent-text:#000000;
    --brand-font:'Arial', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{max-width:100%;overflow-x:hidden;}
  body{
    font-family:var(--brand-font);
    background:var(--brand-bg);
    color:var(--brand-text);
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}

  /* NAV */
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--brand-border);
    position:sticky;top:0;background:var(--brand-bg);z-index:100;
    flex-wrap:wrap;gap:10px;
  }
  .nav-brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .nav-brand img{height:32px;flex-shrink:0;}
  .nav-brand-name{color:var(--brand-accent);font-size:18px;font-weight:900;letter-spacing:.5px;white-space:nowrap;}
  .nav-links a{color:var(--brand-text-muted);font-size:13px;margin-left:18px;}
  .nav-links a:hover{color:var(--brand-accent);}

  /* HEADER */
  .store-header{max-width:1100px;margin:0 auto;padding:32px 20px 8px;}
  .store-header h1{font-size:26px;margin-bottom:6px;}
  .store-header p{color:var(--brand-text-muted);font-size:14px;}

  /* FILTERS */
  .filters{
    max-width:1100px;margin:0 auto;padding:16px 20px 0;
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .filter-btn{
    border:1px solid var(--brand-border);background:var(--brand-surface);
    color:var(--brand-text-muted);font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:16px;cursor:pointer;
  }
  .filter-btn.active{background:var(--brand-accent);color:var(--brand-accent-text);border-color:var(--brand-accent);}

  /* GRID */
  .store-grid{
    max-width:1100px;margin:0 auto;padding:20px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
  }

  /* CARD */
  .product-card{
    background:var(--brand-surface);border:1px solid var(--brand-border);
    border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
    min-width:0;transition:transform .15s ease, border-color .15s ease;
  }
  .product-card:hover{transform:translateY(-2px);border-color:var(--brand-accent);}
  .product-card .cover{width:100%;aspect-ratio:16/10;object-fit:cover;background:#000;display:block;}
  .product-card .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .product-card .kind-badge{
    align-self:flex-start;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:var(--brand-accent);background:rgba(255,214,0,.1);
    padding:3px 8px;border-radius:10px;
  }
  .product-card h3{font-size:15px;line-height:1.3;word-break:break-word;}
  .product-card p{font-size:12.5px;color:var(--brand-text-muted);line-height:1.4;flex:1;}
  .product-card .price-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
  .product-card .price{font-size:14px;font-weight:800;}
  .product-card .view-btn{
    font-size:12px;font-weight:700;background:var(--brand-accent);color:var(--brand-accent-text);
    padding:7px 12px;border-radius:6px;white-space:nowrap;
  }
  .status-pill{
    font-size:10px;font-weight:700;text-transform:uppercase;color:#ffb020;
    background:rgba(255,176,32,.12);padding:3px 8px;border-radius:10px;align-self:flex-start;
  }

  /* STATES */
  .state-box{
    max-width:1100px;margin:0 auto;padding:60px 20px;text-align:center;
    color:var(--brand-text-muted);font-size:14px;
  }
  .spinner{
    width:28px;height:28px;border-radius:50%;
    border:3px solid var(--brand-border);border-top-color:var(--brand-accent);
    margin:0 auto 14px;animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .hidden{display:none !important;}

  @media (max-width:520px){
    .store-header h1{font-size:21px;}
    .nav-links a{margin-left:12px;font-size:12px;}
  }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <img id="brand-logo" src="/GPlogo.png" alt="" />
    <div class="nav-brand-name" id="brand-name">GP73</div>
  </div>
  <div class="nav-links">
    <a id="home-link" href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
  </div>
</nav>

<div class="store-header">
  <h1 id="store-title">Store</h1>
  <p id="store-subtitle">Digital downloads, courses, coaching, and memberships — all in one place.</p>
</div>

<div class="filters" id="filters"></div>

<div id="loading-state" class="state-box">
  <div class="spinner"></div>
  Loading products&hellip;
</div>

<div id="empty-state" class="state-box hidden">
  No products are available in this category yet. Check back soon.
</div>

<div id="error-state" class="state-box hidden">
  We couldn&rsquo;t load the store right now. Please refresh the page.
</div>

<div class="store-grid hidden" id="store-grid"></div>

<script src="/brand-config.js"></script>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const brandSlug = (params.get("brand") || "gp73").toLowerCase();
  const brand = (typeof getBrand === "function") ? getBrand(brandSlug) : null;

  if (brand) {
    document.getElementById("brand-logo").src = brand.logo;
    document.getElementById("brand-name").textContent = brand.name;
    document.getElementById("home-link").href = brand.homeUrl;
    document.title = "Store — " + brand.name;
    document.getElementById("store-subtitle").textContent =
      brand.tagline ? brand.tagline + " — browse everything available." : document.getElementById("store-subtitle").textContent;
    const root = document.documentElement.style;
    root.setProperty("--brand-bg", brand.colors.bg);
    root.setProperty("--brand-surface", brand.colors.surface);
    root.setProperty("--brand-border", brand.colors.border);
    root.setProperty("--brand-text", brand.colors.text);
    root.setProperty("--brand-text-muted", brand.colors.textMuted);
    root.setProperty("--brand-accent", brand.colors.accent);
    root.setProperty("--brand-accent-text", brand.colors.accentText);
    root.setProperty("--brand-font", brand.font);
  }

  const loadingEl = document.getElementById("loading-state");
  const emptyEl = document.getElementById("empty-state");
  const errorEl = document.getElementById("error-state");
  const gridEl = document.getElementById("store-grid");
  const filtersEl = document.getElementById("filters");

  let allProducts = [];
  let activeCategory = "all";

  function money(p) {
    if (p.price_label) return p.price_label;
    if (!p.price_usd) return "Free";
    return "$" + (p.price_usd / 100).toFixed(2);
  }

  function renderFilters(products) {
    const categories = ["all", ...new Set(products.map(p => p.category))];
    filtersEl.innerHTML = "";
    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (cat === activeCategory ? " active" : "");
      btn.textContent = cat === "all" ? "All" : cat.charAt(0).toUpperCase() + cat.slice(1);
      btn.onclick = () => { activeCategory = cat; renderFilters(products); renderGrid(); };
      filtersEl.appendChild(btn);
    });
  }

  function renderGrid() {
    const filtered = activeCategory === "all" ? allProducts : allProducts.filter(p => p.category === activeCategory);

    if (filtered.length === 0) {
      gridEl.classList.add("hidden");
      emptyEl.classList.remove("hidden");
      return;
    }
    emptyEl.classList.add("hidden");
    gridEl.classList.remove("hidden");

    gridEl.innerHTML = "";
    filtered.forEach(p => {
      const card = document.createElement("a");
      card.href = p.is_free_resource && p.landing_path
        ? p.landing_path
        : "/store/" + p.slug + (brandSlug ? ("?brand=" + brandSlug) : "");
      card.className = "product-card";
      card.innerHTML =
        '<img class="cover" src="' + p.cover_image + '" alt="' + p.display_name + '" onerror="this.style.display=\'none\'" />' +
        '<div class="body">' +
          (p.status === "coming_soon" ? '<div class="status-pill">Coming Soon</div>' : '') +
          '<div class="kind-badge">' + p.product_type.replaceAll("_"," ") + '</div>' +
          '<h3>' + p.display_name + '</h3>' +
          '<p>' + p.short_description + '</p>' +
          '<div class="price-row">' +
            '<div class="price">' + money(p) + '</div>' +
            '<div class="view-btn">' + (p.is_free_resource ? "Get Free" : "View") + ' &rarr;</div>' +
          '</div>' +
        '</div>';
      gridEl.appendChild(card);
    });
  }

  fetch("/api/store-products?brand=" + encodeURIComponent(brandSlug))
    .then(r => {
      if (!r.ok) throw new Error("bad status " + r.status);
      return r.json();
    })
    .then(data => {
      loadingEl.classList.add("hidden");
      allProducts = data.products || [];
      if (allProducts.length === 0) {
        emptyEl.classList.remove("hidden");
        return;
      }
      renderFilters(allProducts);
      renderGrid();
    })
    .catch(err => {
      console.error("[store] failed to load products", err);
      loadingEl.classList.add("hidden");
      errorEl.classList.remove("hidden");
    });
})();
</script>

</body>
</html>
