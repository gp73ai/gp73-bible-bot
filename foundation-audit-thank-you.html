<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Your Foundation Audit Is Ready | GP73</title>
<link rel="icon" href="/GPlogo.png" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Libre+Caslon+Display&display=swap");
  :root{--black:#080808;--surface:#11100d;--gold:#f3cc22;--ivory:#f7f0df;--white:#fffdf8;--muted:#b9b1a0;--border:rgba(247,240,223,.18)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(circle at 75% 10%,rgba(243,204,34,.13),transparent 28%),var(--black);color:var(--ivory);font-family:"DM Sans",Arial,sans-serif;display:grid;place-items:center;padding:28px}
  .wrap{width:min(900px,100%);display:grid;grid-template-columns:minmax(220px,.7fr) minmax(0,1.3fr);gap:clamp(34px,7vw,78px);align-items:center}
  .cover{width:100%;max-width:310px;justify-self:center;border:1px solid var(--border);box-shadow:0 30px 80px rgba(0,0,0,.65);transform:rotate(-1.5deg)}
  .mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
  .mark img{width:38px;height:38px;object-fit:contain}
  h1{max-width:12ch;margin-bottom:18px;color:var(--white);font-family:"Libre Caslon Display",Georgia,serif;font-size:clamp(46px,7vw,78px);font-weight:400;line-height:.98}
  p{max-width:560px;margin-bottom:26px;color:var(--muted);font-size:17px;line-height:1.65}
  .download{display:inline-block;padding:16px 22px;background:var(--gold);color:#050505;font-weight:700;text-decoration:none}
  .next{margin-top:20px;font-size:13px;color:var(--muted)}
  .next a{color:var(--ivory);text-underline-offset:3px;text-decoration-color:var(--gold)}
  @media(max-width:700px){.wrap{grid-template-columns:1fr}.cover{max-width:230px}.content{text-align:center}.mark{justify-content:center}h1,p{margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
  <main class="wrap">
    <img class="cover" src="/assets/free/foundation-audit-cover.png" alt="The Foundation Audit PDF cover" />
    <section class="content">
      <span class="mark"><img src="/GPlogo.png" alt="" /> GP73 Bible Intelligence Agency</span>
      <h1>Your audit is ready.</h1>
      <p id="thank-you-copy">Check your inbox for the delivery email. You can also download the Foundation Audit now and begin with the last seven days.</p>
      <a class="download" href="/assets/free/foundation-audit.pdf" download>DOWNLOAD THE FOUNDATION AUDIT</a>
      <div class="next">When you are ready, <a href="/store">explore the Bible Intelligence Agency study library</a>.</div>
    </section>
  </main>
<script>
(function(){
  const firstName = new URLSearchParams(window.location.search).get("first_name");
  if (!firstName) return;
  const safeName = String(firstName).replace(/[^\p{L}\p{M}' -]/gu,"").trim().slice(0,80);
  if (!safeName) return;
  document.getElementById("thank-you-copy").textContent =
    safeName + ", check your inbox for the delivery email. You can also download the Foundation Audit now and begin with the last seven days.";
})();
</script>
</body>
</html>
